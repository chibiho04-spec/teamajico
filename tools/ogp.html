<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #53bca1; position: relative; overflow: hidden; font-family: "Shippori Mincho", serif; }
  .wall { position: absolute; inset: 0; background: url(../assets/img/hero/room.jpg) center 40% / cover no-repeat; opacity: .55; }
  .fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(83,188,161,.2), rgba(83,188,161,.85)); }
  .logo { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: 480px; filter: drop-shadow(0 0 10px rgba(255,255,255,.95)); }
  .tag { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; color: #fff; font-size: 34px; letter-spacing: .22em; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .tag small { display: block; font-size: 22px; letter-spacing: .3em; margin-top: 10px; color: #f5e3d2; }
</style>
</head>
<body>
  <div class="wall"></div>
  <div class="fade"></div>
  <img class="logo" src="../assets/img/logo/logo.png" alt="">
  <div class="tag">沖縄のヘアメイク・スタイリスト チーム<small>HAIR MAKE &amp; STYLIST / OKINAWA</small></div>
</body>
</html>
